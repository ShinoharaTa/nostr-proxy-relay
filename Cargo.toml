[package]
name = "proxy-nostr-relay"
version = "0.2.1"
edition = "2021"
authors = ["ShinoharaTa"]
description = "A Nostr proxy relay with advanced bot filtering and an admin UI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShinoharaTa/nostr-proxy-relay"
homepage = "https://github.com/ShinoharaTa/nostr-proxy-relay"
readme = "README.md"
keywords = ["nostr", "relay", "proxy"]
categories = ["network-programming"]
default-run = "proxy-nostr-relay"
build = "build.rs"
include = [
    "**/*.rs",
    "**/*.toml",
    "**/*.md",
    "**/*.sql",
    "web/dist/**",
    "web/package.json",
    "web/package-lock.json",
    "web/vite.config.ts",
    "web/tsconfig*.json",
    "web/index.html",
    "web/src/**",
    "web/public/**",
]

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
base64 = "0.22"
bech32 = "0.11"
bcrypt = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dashmap = "6"
futures-util = "0.3"
headers = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
regex = "1.10"
pulldown-cmark = "0.10"
rust-embed = { version = "8.5", features = ["axum"] }
mime_guess = "2.0"
reqwest = { version = "0.12", features = ["json"] }

