name: Publish to crates.io

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if version already exists on crates.io
        run: |
          set -euo pipefail

          # Robust parsing of Cargo.toml via Python (tomllib).
          python3 - <<'PY' > /tmp/crate_info.txt
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          pkg = data.get("package", {})
          name = pkg.get("name")
          ver = pkg.get("version")
          if not name or not ver:
            raise SystemExit("Missing [package].name or [package].version in Cargo.toml")
          print(name)
          print(ver)
          PY

          CRATE_NAME="$(sed -n '1p' /tmp/crate_info.txt)"
          CURRENT_VERSION="$(sed -n '2p' /tmp/crate_info.txt)"
          echo "Checking crate: $CRATE_NAME"
          echo "Checking version: $CURRENT_VERSION"

          # Fetch version info from crates.io API (fail on HTTP errors).
          API_RESPONSE="$(curl -fsSL "https://crates.io/api/v1/crates/${CRATE_NAME}")"

          # Parse JSON using Python (avoid jq availability issues).
          python3 - <<PY
          import json, sys

          crate_name = ${CRATE_NAME!r}
          current_version = ${CURRENT_VERSION!r}
          payload = json.loads(${API_RESPONSE!r})

          versions = payload.get("versions", [])
          nums = []
          for v in versions:
            if isinstance(v, dict) and isinstance(v.get("num"), str):
              nums.append(v["num"])

          print("Existing versions on crates.io (first 10):")
          for n in nums[:10]:
            print(n)

          if current_version in nums:
            print(f"::error::Version {current_version} already exists on crates.io for {crate_name}!")
            print("Please update Cargo.toml [package].version before merging this PR.")
            sys.exit(1)

          print(f"✓ Version {current_version} is new and can be published")
          PY

  publish:
    needs: check_version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Publish to crates.io
        run: cargo publish --token ${CRATES_TOKEN} --allow-dirty
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
