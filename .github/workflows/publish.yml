name: Publish to crates.io

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if version already exists on crates.io
        run: |
          CURRENT_VERSION=$(grep '^version' Cargo.toml | cut -d '"' -f 2)
          echo "Checking version: $CURRENT_VERSION"
          
          # Fetch version info from crates.io API
          API_RESPONSE=$(curl -s "https://crates.io/api/v1/crates/proxy-nostr-relay" || echo "")
          
          if [ -z "$API_RESPONSE" ]; then
            echo "::warning::Failed to fetch version info from crates.io API"
            echo "Proceeding with check assuming version is new..."
            exit 0
          fi
          
          EXISTING_VERSIONS=$(echo "$API_RESPONSE" | jq -r '.versions[].num' 2>/dev/null || echo "")
          
          if echo "$EXISTING_VERSIONS" | grep -q "^${CURRENT_VERSION}$"; then
            echo "::error::Version $CURRENT_VERSION already exists on crates.io!"
            echo "Please update the version in Cargo.toml before merging this PR."
            exit 1
          else
            echo "✓ Version $CURRENT_VERSION is new and can be published"
            exit 0
          fi

  publish:
    needs: check_version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Publish to crates.io
        run: cargo publish --token ${CRATES_TOKEN} --allow-dirty
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
